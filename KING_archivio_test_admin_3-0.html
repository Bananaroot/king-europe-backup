<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KING · Database test 3.0</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#e8eff3;color:#253849;margin:0;padding:18px}main{max-width:950px;margin:auto}.card{background:#fff;border:1px solid #cbdce7;border-radius:18px;padding:18px;margin:14px 0}button{padding:11px 14px;border:0;border-radius:10px;background:#d5e7f4;color:#235776;font-weight:700;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px 8px;border-bottom:1px solid #d6e0e6;text-align:left;overflow-wrap:anywhere}small{color:#607788}#state{white-space:pre-wrap}</style></head><body><main><h1>KING · Database test benessere 3.0</h1><p>Archivio privato letto da GitHub all'apertura, senza sincronizzazione continua. Il recupero è disponibile anche manualmente.</p><div class="card"><button id="refresh">Aggiorna da GitHub</button> <button id="export">Scarica copia JSON</button><p id="state">Lettura...</p><p id="count"></p></div><div class="card"><h2>Clienti e registrazioni</h2><div style="overflow:auto"><table><thead><tr><th>Data</th><th>Nome</th><th>Email</th><th>Versione</th><th>Test email</th><th>Punteggi</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>Clic eBay</h2><p id="clickstatus">Lettura...</p><div id="clickrows"></div></div></main><script src="./KING_test_client_config_2-0.js"></script><script src="./KING_test_client_github_3-0.js?v=fix-nome-json-20261101"></script><script>
(()=>{'use strict';const el=id=>document.getElementById(id);let snapshot=null;const cell=(tr,s)=>{const td=document.createElement('td');td.textContent=String(s??'');tr.append(td)};async function load(){el('state').textContent='Lettura del file stazione-test.json...';try{
 const r=await window.KING_TEST_GITHUB.read(window.KING_TEST_GITHUB.registry);const db=r.obj||{};snapshot=db;const items=Array.isArray(db.registrazioni)?db.registrazioni:Array.isArray(db.tests)?db.tests:[];
 const byEmail=new Map();for(const x of items){const k=String(x.email||'').toLowerCase();byEmail.set(k,(byEmail.get(k)||0)+1)};
 el('rows').replaceChildren();for(const x of [...items].reverse()){const tr=document.createElement('tr');[x.received_at||x.date,(x.name||'')+' '+(x.surname||''),x.email,x.version||x.test,byEmail.get(String(x.email||'').toLowerCase())||0,JSON.stringify(x.values||[])].forEach(v=>cell(tr,v));el('rows').append(tr)};
 el('count').textContent=`${items.length} test · ${byEmail.size} email distinte`;
 localStorage.setItem('KING_TEST_CLIENTI_BACKUP_3_0',JSON.stringify(db));el('state').textContent='Archivio aggiornato. Copia locale salvata.';
 }catch(e){el('state').textContent='Errore lettura GitHub: '+e.message};
 try{const r=await window.KING_TEST_GITHUB.read(window.KING_TEST_GITHUB.clicks);const d=r.obj||{};el('clickstatus').textContent='Clic registrati: '+Number(d.totale||0);el('clickrows').replaceChildren();for(const x of (d.links||[]).slice().sort((a,b)=>b.clic-a.clic)){const p=document.createElement('p');p.textContent=`${x.clic} clic · ${x.nome||''} · ${x.url||''}`;el('clickrows').append(p)}}catch(e){el('clickstatus').textContent='Statistiche clic non disponibili: '+e.message}
 };el('refresh').onclick=load;el('export').onclick=()=>{if(!snapshot)return;const url=URL.createObjectURL(new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='KING_TEST_BACKUP_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};load();})();
</script></body></html>
