<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KING · Archivio test 3.0</title><style>body{font:16px system-ui;background:#e8eff3;color:#253849;margin:0;padding:20px}main{max-width:940px;margin:auto}.card{background:white;border-radius:18px;padding:18px;margin:14px 0}button{padding:12px;border-radius:10px;border:0;background:#d7e8f3;color:#225573;font-weight:700}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #ccd7df;padding:9px;text-align:left;overflow-wrap:anywhere}input{padding:10px;width:90%;max-width:600px}small{color:#607788}</style></head><body><main><h1>KING · Database test benessere 3.0</h1><p>Consulta l'archivio GitHub, salva una copia locale ed esporta i dati. Nessun controllo continuo: lettura solo quando apri o premi Aggiorna.</p><div class="card"><button id="refresh">Aggiorna da GitHub</button> <button id="export">Esporta copia JSON</button><p id="status">Lettura in corso…</p><div id="totals"></div></div><div class="card"><h2>Registrazioni</h2><div style="overflow:auto"><table><thead><tr><th>Data</th><th>Cliente</th><th>Email</th><th>Versione</th><th>Test email</th><th>Punteggi</th></tr></thead><tbody id="entries"></tbody></table></div></div><div class="card"><h2>Clic prodotti</h2><p id="clickst">Lettura…</p><div id="links"></div></div></main><script src="./KING_test_client_config_2-0.js"></script><script src="./KING_test_client_github_3-0.js"></script><script>let latest=null;const el=id=>document.getElementById(id);function cell(tr,s){const td=document.createElement('td');td.textContent=String(s??'');tr.append(td)}async function load(){el('status').textContent='Lettura…';try{const r=await window.KING_TEST_GITHUB.read('archivio-test.json');const db=r.obj||{};latest=db;const items=db.registrazioni||[];el('entries').replaceChildren();items.slice().reverse().forEach(x=>{let tr=document.createElement('tr');const n=items.filter(y=>String(y.email).toLowerCase()===String(x.email).toLowerCase()).length;[x.received_at||x.date,(x.name||'')+' '+(x.surname||''),x.email,x.version||x.test,n,JSON.stringify(x.values||[])].forEach(v=>cell(tr,v));el('entries').append(tr)});el('status').textContent='Registrazioni: '+items.length+' · Email distinte: '+new Set(items.map(x=>String(x.email||'').toLowerCase())).size;localStorage.setItem('KING_CLIENTI_COPIA_3_0',JSON.stringify(db));}catch(e){el('status').textContent='Errore di lettura: '+e.message;}try{const c=(await window.KING_TEST_GITHUB.read('clic-prodotti.json')).obj||{};el('clickst').textContent='Totale clic registrati: '+(c.totale||0);el('links').replaceChildren();(c.links||[]).sort((a,b)=>b.clic-a.clic).forEach(x=>{const p=document.createElement('p');p.textContent=x.clic+' clic · '+(x.nome||'')+' · '+x.url;el('links').append(p)})}catch(e){el('clickst').textContent='Statistiche non disponibili: '+e.message}}el('refresh').onclick=load;el('export').onclick=()=>{if(!latest)return;const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(latest,null,2)],{type:'application/json'}));a.href=u;a.download='KING_TEST_CLIENTI_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};load()</script></body></html>
