<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KING TEST 2.0 · archivio</title><style>body{background:#f1f3f6;color:#27313b;font:16px system-ui;margin:24px auto;max-width:900px;padding:0 12px}section{background:white;padding:22px;border-radius:16px;margin:12px 0}input,button{padding:10px;margin:5px 0;max-width:100%;box-sizing:border-box}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;text-align:left;padding:8px}small{color:#65717a}</style><section><h1>KING · Archivio test 2.0</h1><p>Visualizzazione privata di collaudo. Inserisci il token solo nel tuo browser. Non salvato da questa pagina.</p><input id="token" type="password" placeholder="Token repository test" autocomplete="off" size="37"><button id="load">Leggi da GitHub</button><p id="status"></p></section><section id="out"></section><script>document.getElementById('load').onclick=async()=>{const status=document.getElementById('status'),area=document.getElementById('out');area.textContent='';try{const t=document.getElementById('token').value.trim();if(!t)throw Error('Inserisci il token');const r=await fetch('https://api.github.com/repos/Bananaroot/king-test-benessere-dati/contents/archivio-test.json',{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw Error('GitHub HTTP '+r.status);const j=await r.json();const db=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\s/g,'')),c=>c.charCodeAt(0))));const rows=db.registrazioni||[];status.textContent='Registrazioni: '+rows.length;const counts={};rows.forEach(x=>{counts[x.email]=(counts[x.email]||0)+1});const table=document.createElement('table');const hdr=document.createElement('tr');['Data','Cliente','Email','Versione','Test per email','Punteggi'].forEach(s=>{let h=document.createElement('th');h.textContent=s;hdr.append(h)});table.append(hdr);rows.forEach(x=>{const tr=document.createElement('tr');[x.received_at,x.name+' '+x.surname,x.email,x.version,counts[x.email],JSON.stringify(x.values)].forEach(v=>{let td=document.createElement('td');td.textContent=v??'';tr.append(td)});table.append(tr)});area.append(table);}catch(e){status.textContent='Errore: '+e.message}};</script></html>
