'use strict';const DATA={it:{ey:'AUTOVALUTAZIONE · 2 MINUTI',title:'Come stai davvero?',lead:'Quindici domande per riflettere su motivazione, serenità, relazioni, stress ed energia.',start:'Inizia il test gratuito',disclaimer:'Questo è un questionario orientativo non validato clinicamente. Non misura ormoni, non individua carenze e non fornisce diagnosi. Se i sintomi persistono, parlane con un professionista sanitario.',step:'DOMANDA',of:'DI 15',prompt:'Scegli la risposta che ti descrive meglio, senza pensarci troppo.',names:['Motivazione','Serenità','Relazioni','Gestione dello stress','Energia'],questions:[['Quando hai un po’ di tempo libero, come ti senti?',['Non ho voglia di fare nulla','Vorrei fare qualcosa, ma non so cosa','Ho idee, ma l’interesse svanisce presto','Ho voglia di iniziare, anche se a volte rimando','Sono curioso e trovo facilmente attività piacevoli']],['Come ti senti quando sei da solo con te stesso?',['Mi giudico duramente','Mi sento spesso insicuro','Sto discretamente, con qualche dubbio','Mi accetto per come sono','Mi sento generalmente a mio agio con me stesso']],['Come vivi le relazioni con le persone vicine?',['Mi sento isolato e faccio fatica a fidarmi','Tengo spesso le distanze','Mi fido di alcune persone','Mi piace stare con gli altri e creare legami','Mi sento sostenuto e in connessione con gli altri']],['Come affronti le pressioni di una giornata normale?',['Mi sento spesso sopraffatto','Mi preoccupo molto e fatico a recuperare','A volte sono teso, ma riesco a gestirmi','Di solito recupero abbastanza bene','Resto generalmente tranquillo e flessibile']],['Quando incontri un ostacolo impegnativo, cosa succede?',['Mi blocco e rinuncio','Provo, ma perdo presto slancio','Alterno momenti di energia e stanchezza','Di solito persevero','Affronto le sfide con costanza e risorse']]],result:'Il tuo quadro di benessere',sub:'Una fotografia soggettiva di come ti senti oggi, non un esame biologico.',low:'Area da osservare',mid:'In equilibrio variabile',high:'Risorsa percepita',tips:'Piccoli passi utili',tipitems:['Mantieni orari di sonno regolari e ritagliati momenti di riposo.','Inserisci movimento piacevole e attività all’aria aperta nella routine.','Coltiva contatti sociali e chiedi sostegno quando serve.','Se stanchezza, ansia o cambiamenti dell’umore durano nel tempo, valuta un confronto medico.'],print:'Salva come PDF / Stampa',again:'Rifai il test',back:'Indietro',report:'Il tuo report gratuito',privacy:'Le risposte vengono elaborate soltanto nel tuo browser: non vengono inviate a un server.',details:'I punteggi descrivono solo le risposte date, su una scala 0–100. Non rappresentano livelli di dopamina, serotonina, ossitocina, cortisolo o testosterone.',date:'Data',foot:'Prototipo indipendente · nessun login · nessuna raccolta di risposte.'},ru:{ey:'САМООЦЕНКА · 2 МИНУТЫ',title:'Как вы себя чувствуете?',lead:'Пять вопросов о мотивации, спокойствии, отношениях, стрессе и энергии.',start:'Начать бесплатный тест',disclaimer:'Это невалидированный опрос о самочувствии. Он не измеряет гормоны, не выявляет дефициты и не ставит диагноз. При стойких симптомах обратитесь к врачу.',step:'ВОПРОС',of:'ИЗ 5',prompt:'Выберите наиболее подходящий ответ.',names:['Мотивация','Спокойствие','Отношения','Стрессоустойчивость','Энергия'],questions:[['Как вы чувствуете себя в свободное время?',['Ничего не хочется делать','Хочется чем-то заняться, но не знаю чем','Есть идеи, но интерес быстро пропадает','Хочется начать, хотя иногда откладываю','Легко нахожу интересные занятия']],['Как вы относитесь к себе наедине с собой?',['Часто резко критикую себя','Нередко сомневаюсь в себе','В целом нормально, иногда неуверенно','Принимаю себя таким, какой я есть','Обычно чувствую себя уверенно и спокойно']],['Как складываются отношения с близкими?',['Чувствую изоляцию, трудно доверять','Часто держу дистанцию','Доверяю некоторым людям','Люблю общаться и строить отношения','Чувствую поддержку и близость']],['Как вы справляетесь с повседневным напряжением?',['Часто не справляюсь','Много тревожусь и трудно восстанавливаюсь','Иногда напряжён, но справляюсь','Обычно восстанавливаюсь довольно быстро','Чаще всего спокоен и гибок']],['Что происходит, когда возникает трудное препятствие?',['Замираю и отказываюсь','Пробую, но быстро теряю силы','То энергичен, то устаю','Обычно продолжаю двигаться вперёд','Уверенно преодолеваю трудности']]],result:'Ваш профиль самочувствия',sub:'Субъективная оценка сегодняшнего состояния, не медицинский анализ.',low:'Зона внимания',mid:'Нестабильное равновесие',high:'Сильная сторона',tips:'Полезные маленькие шаги',tipitems:['Соблюдайте регулярный режим сна и отдыха.','Добавляйте приятную физическую активность и прогулки.','Поддерживайте общение и просите помощи, когда нужно.','При длительной тревоге, усталости или изменениях настроения обратитесь к врачу.'],print:'Сохранить PDF / Печать',again:'Пройти ещё раз',back:'Назад',report:'Ваш бесплатный отчёт',privacy:'Ответы обрабатываются только в браузере и не отправляются на сервер.',details:'Баллы отражают только выбранные ответы по шкале 0–100. Это не уровни дофамина, серотонина, окситоцина, кортизола или тестостерона.',date:'Дата',foot:'Независимый прототип · без входа · без сбора ответов.'},en:{ey:'SELF-CHECK · 2 MINUTES',title:'How are you feeling?',lead:'Seven questions to reflect on motivation, calm, connection, stress and energy.',start:'Start the free check-in',disclaimer:'This is not a clinically validated questionnaire. It does not measure hormones, detect deficiencies or provide a diagnosis. Speak with a healthcare professional about persistent symptoms.',step:'QUESTION',of:'OF 5',prompt:'Choose the answer that fits you best.',names:['Motivation','Calm','Connection','Stress coping','Energy'],questions:[['How do you feel when you have free time?',['I do not feel like doing anything','I want to do something but cannot decide','I have ideas but lose interest quickly','I want to get started, though I sometimes delay','I easily find enjoyable things to do']],['How do you feel about yourself when alone?',['I judge myself harshly','I often feel insecure','Mostly okay, with some doubts','I accept myself as I am','I usually feel comfortable with myself']],['How do you experience close relationships?',['I feel isolated and struggle to trust','I often keep my distance','I trust a few people','I enjoy connecting with others','I feel supported and connected']],['How do you handle everyday pressure?',['I often feel overwhelmed','I worry a lot and struggle to recover','I get tense but usually manage','I generally recover reasonably well','I usually stay calm and adaptable']],['What happens when you face a difficult obstacle?',['I freeze and give up','I try but lose momentum quickly','My energy comes and goes','I usually keep going','I tackle challenges consistently']]],result:'Your wellbeing snapshot',sub:'A subjective picture of how you feel today, not a biological test.',low:'Worth paying attention to',mid:'Mixed experience',high:'Perceived strength',tips:'Small helpful steps',tipitems:['Keep a consistent sleep schedule and make room for rest.','Build enjoyable movement and outdoor time into your routine.','Stay connected with people and ask for support when needed.','Seek professional advice if fatigue, anxiety or mood changes persist.'],print:'Save as PDF / Print',again:'Take the test again',back:'Back',report:'Your free report',privacy:'Your answers are processed only in your browser and are not sent to a server.',details:'Scores summarize only your selected answers on a 0–100 scale. They are not dopamine, serotonin, oxytocin, cortisol or testosterone levels.',date:'Date',foot:'Independent prototype · no login · no response collection.'}};
const EXTRA={"it":[["Quanto spesso riesci a iniziare un’attività che ti interessa?",["Anche se mi interessa, rimando e finisco per non iniziare","Parto con buone intenzioni, ma spesso mi fermo prima di cominciare","Alcune volte parto subito, altre ho bisogno di una spinta","Quando qualcosa mi interessa, generalmente riesco a iniziare","Mi viene naturale mettermi all’opera quando qualcosa mi appassiona"]],["Quanto ti senti soddisfatto delle piccole cose quotidiane?",["Le giornate mi sembrano tutte uguali e fatico a trovare piacere","Mi accorgo delle cose piacevoli, ma raramente mi coinvolgono","Alcuni piccoli momenti mi fanno sorridere, altri mi sfuggono","Riesco a godermi diversi momenti semplici della giornata","Anche le piccole cose riescono spesso a rendere speciale la mia giornata"]],["Quanto spesso riesci a trattarti con gentilezza quando sbagli?",["Quando sbaglio, continuo a rimproverarmi a lungo","Mi è difficile perdonarmi, anche per errori piccoli","A volte mi comprendo, altre sono troppo severo con me stesso","Cerco di imparare dagli errori senza giudicarmi troppo","Riesco a trattarmi con comprensione anche quando qualcosa va storto"]],["Quanto ti senti a tuo agio nel dire quello che pensi?",["Mi trattengo perché temo che la mia opinione venga giudicata","Spesso preferisco tacere anche quando avrei qualcosa da dire","Con alcune persone riesco a esprimermi, con altre mi blocco","Generalmente riesco a dire ciò che penso con rispetto","Mi sento libero di esprimere le mie idee anche quando sono diverse"]],["Hai qualcuno con cui parlare apertamente?",["Non sento di avere qualcuno con cui potermi aprire","Vorrei confidarmi, ma temo di non essere capito","C’è qualcuno con cui parlo, ma non sempre riesco ad aprirmi","Ho almeno una persona con cui riesco a parlare sinceramente","So a chi rivolgermi e mi sento ascoltato quando ne ho bisogno"]],["Quanto ti senti compreso dalle persone importanti per te?",["Ho spesso la sensazione che nessuno colga davvero ciò che provo","Anche vicino agli altri, a volte mi sento poco ascoltato","Con alcune persone mi sento capito, con altre faccio fatica","Le persone importanti per me cercano di comprendermi","Mi sento accolto e compreso dalle persone a cui tengo"]],["Dopo una giornata impegnativa riesci a rilassarti?",["Dopo una giornata intensa, continuo a sentirmi in tensione","Mi serve molto tempo per staccare dai pensieri della giornata","Alcune sere riesco a rilassarmi, altre resto agitato","Di solito trovo un modo per rallentare e recuperare","Riesco a concedermi una pausa e a ritrovare tranquillità"]],["Quanto spesso le preoccupazioni disturbano il tuo riposo?",["Le preoccupazioni continuano a girarmi in testa anche quando vorrei dormire","Mi capita di andare a letto teso e di faticare ad addormentarmi","Alcune notti riposo bene, altre i pensieri mi tengono sveglio","Di solito riesco a mettere da parte i pensieri prima di dormire","Quando arriva il momento di riposare, riesco a lasciar andare le preoccupazioni"]],["Al mattino quanto ti senti riposato?",["Mi alzo già stanco, come se non avessi riposato","Anche dopo una notte di sonno mi sento spesso affaticato","Ci sono mattine buone e altre in cui faccio fatica a partire","Di solito mi sveglio con abbastanza energie per iniziare","Mi sveglio riposato e pronto ad affrontare la giornata"]],["Quanta energia senti durante una giornata normale?",["Mi sembra di esaurire le energie già nelle prime ore","Riesco a fare le cose necessarie, ma mi sento spesso scarico","Ho momenti attivi alternati ad altri in cui devo fermarmi","Durante la giornata riesco generalmente a mantenere un buon ritmo","Mi sento vitale e riesco a dedicare energie anche a ciò che amo"]]],"ru":[["Как часто вам удаётся начать интересное дело?",["Почти никогда","Редко","Иногда","Часто","Почти всегда"]],["Насколько вас радуют маленькие повседневные вещи?",["Совсем нет","Немного","Умеренно","Сильно","Очень сильно"]],["Как часто вы добры к себе, когда ошибаетесь?",["Никогда","Редко","Иногда","Часто","Почти всегда"]],["Насколько свободно вы выражаете своё мнение?",["Совсем нет","Немного","Умеренно","Свободно","Очень свободно"]],["Есть ли у вас человек для откровенного разговора?",["Никого","Почти никого","Иногда","Часто","Всегда"]],["Насколько вас понимают близкие?",["Совсем нет","Немного","Умеренно","Хорошо","Очень хорошо"]],["Можете ли вы расслабиться после сложного дня?",["Никогда","Редко","Иногда","Часто","Почти всегда"]],["Как часто тревоги мешают вашему сну?",["Всегда","Часто","Иногда","Редко","Никогда"]],["Насколько отдохнувшим вы просыпаетесь?",["Совсем нет","Немного","Умеренно","Хорошо","Полностью"]],["Сколько энергии у вас в обычный день?",["Нет сил","Мало","По-разному","Достаточно","Много"]]],"en":[["How often can you get started on something you enjoy?",["Almost never","Rarely","Sometimes","Often","Almost always"]],["How much do small everyday things bring you pleasure?",["Not at all","A little","Somewhat","A lot","Very much"]],["How often are you kind to yourself when you make mistakes?",["Never","Rarely","Sometimes","Often","Almost always"]],["How comfortable are you expressing your opinion?",["Not at all","A little","Somewhat","Very","Extremely"]],["Do you have someone you can talk openly with?",["No one","Almost no one","Sometimes","Often","Always"]],["How understood do you feel by those close to you?",["Not at all","A little","Somewhat","Very","Extremely"]],["Can you relax after a demanding day?",["Never","Rarely","Sometimes","Often","Almost always"]],["How often do worries interfere with your rest?",["Always","Often","Sometimes","Rarely","Never"]],["How rested do you feel in the morning?",["Not at all","A little","Somewhat","Very","Extremely"]],["How much energy do you have on a typical day?",["None","Little","It varies","Good energy","Lots of energy"]]]};const CAT=[0,1,2,3,4,1,3];const REPORT={"it":{"detailsTitle":"Lettura personalizzata","explain":["La motivazione racconta quanto ti senti coinvolto e capace di iniziare att lectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});render();

#pdf-report h1{font:normal 32pt Georgia,serif;margin:8px 0;color:#221b29}
#pdf-report h2{font:normal 19pt Georgia,serif;margin:20px 0 10px}
#pdf-report .pdf-tag{font-size:9pt;color:#9b6726;letter-spacing:2px;font-weight:bold}
#pdf-report .pdf-row{padding:12px 0;border-bottom:1px solid #e6dfe8;break-inside:avoid}
#pdf-report .pdf-row-head{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:7px}
#pdf-report .pdf-track{height:12px;background:#e8e3e9;border-radius:10px;overflow:hidden}
#pdf-report .pdf-track div{height:100%;background:#efb65d;print-color-adjust:exact;-webkit-print-color-adjust:exact}
#pdf-report .pdf-section{break-inside:avoid;margin:17px 0}
#pdf-report .pdf-muted{color:#63596a}
#pdf-report .pdf-page{break-before:page}
#pdf-report .pdf-note{border-left:3px solid #e0a64d;padding:9px 12px;background:#faf7f1;print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
<script>
function updateChemBars(values){const el=document.getElementById('results-summary');if(!el)return;el.querySelectorAll('.chemitem').forEach((item,i)=>item.style.setProperty('--pct',Math.max(0,Math.min(100,values[i]||0))+'%'));}
function prepareReport(){
const form=document.getElementById('lead-preview');
if(!form || !form.reportValidity())return;
const data=new FormData(form);const name=(data.get('given-name')||'').trim(),surname=(data.get('family-name')||'').trim(),email=(data.get('email')||'').trim(),country=(data.get('country')||'').trim();
/* V3 pubblica: stampa disponibile senza anagrafica */
const values=Array.from({length:5},(_,i)=>Math.round(answers.reduce((sum,a,j)=>sum+(CAT[j]===i?a*25:0),0)/CAT.filter(c=>c===i).length));
const langNames=CHEM_LABELS[lang];const r=REPORT[lang];const labels=t().names;
const intro=lang==='it'?'Profilo personale di benessere percepito':lang==='ru'?'Личный профиль субъективного благополучия':'Personal perceived wellbeing profile';
const summary=values.map((v,i)=>`<div class="pdf-row"><div class="pdf-row-head"><span>${escapeHTML(langNames[i])} · ${escapeHTML(labels[i])}</span><span>${v}/100</span></div><div class="pdf-track"><div style="width:${v}%"></div></div></div>`).join('');
const detailed=values.map((v,i)=>`<div class="pdf-section"><h2>${escapeHTML(langNames[i])} · ${escapeHTML(labels[i])} · ${v}/100</h2><p>${escapeHTML(r.explain[i])}</p><p>${v<=25?'Le risposte suggeriscono che quest’area potrebbe richiedere più attenzione nella tua quotidianità.':v<=65?'Le risposte indicano un’esperienza variabile, con momenti più semplici e altri più impegnativi.':'Le risposte descrivono quest’area come una risorsa percepita in questo periodo.'}</p><p><b>${escapeHTML(r.next)}:</b> ${escapeHTML(r.action[i])}</p></div>`).join('');
let pdf=document.getElementById('pdf-report');if(!pdf){pdf=document.createElement('article');pdf.id='pdf-report';document.body.appendChild(pdf)}
pdf.innerHTML=`<div class="pdf-head"><div class="pdf-tag">✦ KING WELLBEING · REPORT PERSONALE</div><h1>${intro}</h1><div class="pdf-muted">${escapeHTML(name)} ${escapeHTML(surname)} · ${escapeHTML(country)} · ${new Date().toLocaleDateString()}<br>${escapeHTML(email)}</div></div><h2>Il tuo quadro in cinque aree</h2>${summary}<p class="pdf-note">I punteggi rappresentano risposte soggettive al questionario e non misurano concentrazioni di ormoni, né diagnosticano carenze o squilibri.</p><div class="pdf-page"><div class="pdf-tag">LETTURA PERSONALIZZATA</div>${detailed}</div><div class="pdf-note">Questo rapporto è informativo. Per sintomi persistenti o preoccupazioni sulla salute, rivolgiti a un professionista sanitario qualificato.</div>`;
pdf.innerHTML += (window.kingV9PdfSection ? window.kingV9PdfSection() : '');
pdf.innerHTML += (window.kingV10PdfSection ? window.kingV10PdfSection() : '');
window.print();
}
</script>
