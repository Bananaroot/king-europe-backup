<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KING · Clic eBay dal test</title><style>body{background:#110f17;color:#f3edf4;font:16px system-ui;margin:0;padding:24px}main{max-width:740px;margin:auto}.card{background:#201b29;border:1px solid #564454;border-radius:20px;padding:22px;margin:14px 0}h1{color:#f3bf70}small,p{color:#c8c0ca}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #49404e;padding:10px;text-align:left;word-break:break-word}a{color:#f3bf70}button{background:#f3bf70;border:0;border-radius:12px;padding:11px;cursor:pointer}#empty{color:#eaa}</style></head><body><main><h1>KING · Monitoraggio clic eBay</h1><p>Statistiche salvate su <b>questo dispositivo</b>. Non rappresentano tutti i clienti: per un conteggio globale devi configurare il servizio di raccolta indicato nel file README.</p><div class="card"><h2 id="total">0 clic</h2><p id="empty"></p></div><div class="card"><h2>Prodotti aperti dal Test Benessere</h2><table><thead><tr><th>Prodotto</th><th>Area</th><th>Clic</th></tr></thead><tbody id="rows"></tbody></table></div><button onclick="exportData()">Esporta clic CSV</button> <a href="./test-benessere.html">Torna al test</a></main><script>
const data=(()=>{try{return JSON.parse(localStorage.getItem('king-ebay-test-clicks-v1')||'[]')}catch(e){return []}})();
document.getElementById('total').textContent=data.length+' clic registrati';
if(!data.length)document.getElementById('empty').textContent='Nessun clic registrato su questo browser.';
const m={};data.forEach(e=>{const k=e.product_id+'|'+e.area;m[k]??={name:e.product_name,area:e.area,n:0};m[k].n++});
Object.values(m).sort((a,b)=>b.n-a.n).forEach(e=>{const tr=document.createElement('tr');[e.name,e.area,String(e.n)].forEach(s=>{const c=document.createElement('td');c.textContent=s;tr.append(c)});document.getElementById('rows').append(tr)});
function exportData(){const rows=[['data','prodotto','area','venditore'],...data.map(e=>[e.date,e.product_name,e.area,e.shop])];const csv=rows.map(row=>row.map(x=>'"'+String(x||'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='KING-click-test.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
</script></body></html>
